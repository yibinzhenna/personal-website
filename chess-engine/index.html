<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A chess engine written in C++, compiled to WebAssembly." />
  <title>Chess Engine — Yibin Zhen</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="chess.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">

    <header>
      <a href="../" class="name">Yibin Zhen</a>
      <nav>
        <a href="../">home</a>
        <span class="sep"> ⁄ </span>
        <a href="../#projects">projects</a>
      </nav>
    </header>

    <div class="content chess-wrap">

      <h1 class="chess-title">Chess Engine</h1>
      <p class="chess-lede">
        Written in C++, compiled to WebAssembly — the engine runs entirely in
        your browser, with no server involved.
      </p>

      <div class="chess-controls">
        <select id="chess-difficulty" aria-label="Difficulty">
          <option value="0">Beginner</option>
          <option value="1" selected>Intermediate</option>
          <option value="2">Advanced</option>
          <option value="3">Magnus Carlsen</option>
        </select>

        <select id="chess-side" aria-label="Play as">
          <option value="0" selected>as White</option>
          <option value="1">as Black</option>
        </select>

        <button id="chess-new" type="button">New game</button>
        <button id="chess-undo" type="button" disabled>Undo</button>
      </div>

      <div class="chess-board" id="chess-board"></div>

      <div class="chess-statusbar">
        <span class="chess-status" id="chess-status">Loading engine…</span>
        <span class="chess-promotion" id="chess-promotion" hidden></span>
      </div>

      <p class="chess-note">Click a piece, then click where you want it to go.</p>

    </div>

    <footer>
      <a href="mailto:yibinzhe@usc.edu"><i class="fa-solid fa-envelope"></i> yibinzhe@usc.edu</a>
      <span class="dot">•</span>
      <a href="https://github.com/yibinzhenna"><i class="fa-brands fa-github"></i> yibinzhenna</a>
      <span class="dot">•</span>
      <a href="https://www.linkedin.com/in/yibinzhen/"><i class="fa-brands fa-linkedin"></i> Yibin Zhen</a>
    </footer>

  </div>

  <script src="chess.js"></script>
</body>
</html>
